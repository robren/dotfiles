
# Makes tmux  work with full cloro terminals
set-option -sa terminal-overrides ",xterm*:Tc"

set -g mouse on
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# Use Alt instead of Ctrl for pane nav so Ctrl-h/j/k/l don't shadow readline bindings (Ctrl-K etc.)
set -g @vim_navigator_mapping_left 'M-h'
set -g @vim_navigator_mapping_down 'M-j'
set -g @vim_navigator_mapping_up 'M-k'
set -g @vim_navigator_mapping_right 'M-l'
set -g @vim_navigator_mapping_prev 'M-\'
#set -g @plugin 'catppuccin/tmux'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

# I can hit shift V, just like in vim and slect some text then Y
# yanks to the system clipboard
set -g @plugin 'tmux-plugins/tmux-yank'


run `~/.tmux/plugins/tpm/tpm`
